name: _job_build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      arch:
        required: false
        type: string
        default: x86_64

jobs:
  proton:
    name: Build ${{ inputs.name }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Cleanup disk space
        uses: endersonmenezes/free-disk-space@v3
        continue-on-error: ${{ inputs.arch == 'arm64' }}
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_codeql: true
          remove_docker_images: true
          remove_swap: true
          remove_packages: |
            azure-cli google-cloud-cli google-chrome-stable firefox microsoft-edge-stable
            postgresql* mysql* php* temurin-* *llvm* clang* mono-devel powershell dotnet-sdk-*
          remove_folders: |
            /usr/share/swift /usr/share/miniconda /usr/local/lib/node_modules
            /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia*
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/share/az*
            /usr/local/.ghcup

      - name: Prepare host
        run: |
          sudo apt update && sudo apt-get install -y ccache fontforge-nox
          df -h /

      - name: Cache key
        id: cache-key
        run: echo "prefix=${{ inputs.arch == 'arm64' && 'ccache-arm64-proton' || 'ccache-proton' }}" >> "$GITHUB_OUTPUT"

      - name: Restore cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Patch
        run: |
          # sourceware.org rate-limits the runner IP range; clone bzip2 from the mirror
          git config --global url."https://gitlab.com/bzip2/bzip2.git".insteadOf https://sourceware.org/git/bzip2.git
          git submodule update --init --filter=tree:0 --recursive
          # apply proton-ge-custom patches; failed hunks are fatal
          ./patches/protonprep-valve-staging.sh 2>&1 | tee /tmp/protonprep.log || true
          if grep -q "FAILED" /tmp/protonprep.log; then
            echo "ERROR: patch hunks FAILED during protonprep" >&2
            exit 1
          fi
          # strip binaries at compile time to save space in the runner
          patch -Np1 -i ./.github/patches/0001-build-strip-binaries-early.patch
          mkdir ./build

      - name: Configure
        working-directory: ./build
        run: |
          ../configure.sh --build-name=${{ inputs.name }} --container-engine=docker --target-arch=${{ inputs.arch }}

      - name: Make ${{ inputs.name }}
        working-directory: ./build
        run: |
          make -j$(nproc) redist

      - name: Save cache
        id: ccache-save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload artifact ${{ inputs.name }}.tar.gz
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.name }}.tar.gz
          path: ./build/${{ inputs.name }}.tar.gz

      - name: Upload artifact ${{ inputs.name }}.sha512sum
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.name }}.sha512sum
          path: ./build/${{ inputs.name }}.sha512sum

